<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shop | RoadReady</title>

    <meta
        name="description"
        content="Shop genuine motorcycle parts, accessories, riding gear and maintenance products at RoadReady."
    >

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Main Styles -->
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/pages.css" />
    <link rel="stylesheet" href="/css/responsive.css" />

</head>


<body>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <div id="site-header"></div>



    <main>


        <!-- =================================================
             SHOP HERO
             ================================================= -->

        <section class="rr-shop-hero">

            <div class="rr-container">

                <div class="rr-shop-hero-content">

                    <span class="rr-section-eyebrow">
                        ROADREADY SHOP
                    </span>

                    <h1>
                        Motorcycle Parts & Gear
                    </h1>

                    <p>
                        Find the parts, accessories and riding essentials
                        you need for every journey.
                    </p>

                </div>

            </div>

        </section>



        <!-- =================================================
             SHOP CONTENT
             ================================================= -->

        <section class="rr-shop">

            <div class="rr-container">


                <!-- =============================================
                     SEARCH
                     ============================================= -->

                <div class="rr-shop-search">

                    <label
                        for="shop-search"
                        class="rr-visually-hidden"
                    >
                        Search products
                    </label>

                    <i class="bi bi-search"></i>

                    <input
                        type="search"
                        id="shop-search"
                        placeholder="Search motorcycle parts, accessories..."
                        autocomplete="off"
                    >

                </div>



                <!-- =============================================
                     SHOP LAYOUT
                     ============================================= -->

                <div class="rr-shop-layout">


                    <!-- =========================================
                         FILTER SIDEBAR
                         ========================================= -->

                    <aside class="rr-shop-sidebar">


                        <div class="rr-filter-header">

                            <h2>
                                Filters
                            </h2>

                            <button
                                type="button"
                                class="rr-clear-filters"
                                id="clear-filters"
                            >
                                Clear All
                            </button>

                        </div>


                        <!-- Categories -->

                     <div class="rr-filter-group">

    <h3>
        Category
    </h3>

    <label class="rr-filter-option">

        <input
            type="checkbox"
            name="category"
            value="Accessories"
        >

        <span>
            Accessories
        </span>

    </label>


    <label class="rr-filter-option">

        <input
            type="checkbox"
            name="category"
            value="Maintenance"
        >

        <span>
            Maintenance
        </span>

    </label>


    <label class="rr-filter-option">

        <input
            type="checkbox"
            name="category"
            value="Spare Parts"
        >

        <span>
            Spare Parts
        </span>

    </label>


    <label class="rr-filter-option">

        <input
            type="checkbox"
            name="category"
            value="Riding Gear"
        >

        <span>
            Riding Gear
        </span>

    </label>


    <label class="rr-filter-option">

        <input
            type="checkbox"
            name="category"
            value="Safety"
        >

        <span>
            Safety
        </span>

    </label>

</div>
                        <!-- Price -->

                        <div class="rr-filter-group">

                            <h3>
                                Price Range
                            </h3>

                            <div class="rr-price-inputs">

                                <div class="rr-price-field">

                                    <span>
                                        ৳
                                    </span>

                                    <input
                                        type="number"
                                        id="min-price"
                                        placeholder="Min"
                                        min="0"
                                    >

                                </div>


                                <span class="rr-price-divider">
                                    —
                                </span>


                                <div class="rr-price-field">

                                    <span>
                                        ৳
                                    </span>

                                    <input
                                        type="number"
                                        id="max-price"
                                        placeholder="Max"
                                        min="0"
                                    >

                                </div>

                            </div>

                        </div>



                        <!-- Availability -->

                        <div class="rr-filter-group">

                            <h3>
                                Availability
                            </h3>

                            <label class="rr-filter-option">

                                <input
                                    type="checkbox"
                                    name="availability"
                                    value="in-stock"
                                >

                                <span>
                                    In Stock
                                </span>

                            </label>



                        </div>


                    </aside>



                    <!-- =========================================
                         PRODUCTS AREA
                         ========================================= -->

                    <div class="rr-shop-products">


                        <!-- Products toolbar -->

                        <div class="rr-shop-toolbar">


                            <div class="rr-shop-results">

                                <span id="shop-results-count">
                                    Showing 0 products
                                </span>

                            </div>


                            <div class="rr-shop-sort">

                                <label for="shop-sort">
                                    Sort by
                                </label>

                                <select id="shop-sort">

                                    <option value="featured">
                                        Featured
                                    </option>

                                    <option value="newest">
                                        Newest
                                    </option>

                                    <option value="price-low">
                                        Price: Low to High
                                    </option>

                                    <option value="price-high">
                                        Price: High to Low
                                    </option>

                                    <option value="rating">
                                        Highest Rated
                                    </option>

                                </select>

                            </div>


                        </div>



                        <!-- Product Grid -->

                        <div id="shop-product-grid"></div>



                        <!-- Empty State -->

                        <div
                            class="rr-shop-empty"
                            id="shop-empty"
                            hidden
                        >

                            <div class="rr-shop-empty-icon">

                                <i class="bi bi-search"></i>

                            </div>

                            <h2>
                                No products found
                            </h2>

                            <p>
                                Try adjusting your search or filters.
                            </p>

                            <button
                                type="button"
                                id="empty-clear-filters"
                                class="rr-primary-button"
                            >
                                Clear Filters
                            </button>

                        </div>



                        <!-- Pagination -->

                        <nav
                            class="rr-pagination"
                            aria-label="Shop pagination"
                        >

                            <button
                                type="button"
                                class="rr-pagination-button"
                                aria-label="Previous page"
                            >
                                <i class="bi bi-chevron-left"></i>
                            </button>


                            <button
                                type="button"
                                class="rr-pagination-button active"
                                aria-current="page"
                            >
                                1
                            </button>


                            <button
                                type="button"
                                class="rr-pagination-button">
                                2
                            </button>


                            <button
                                type="button"
                                class="rr-pagination-button">
                                3
                            </button>


                            <span class="rr-pagination-dots">
                                ...
                            </span>


                            <button
                                type="button"
                                class="rr-pagination-button"
                            >
                                8
                            </button>


                            <button
                                type="button"
                                class="rr-pagination-button"
                                aria-label="Next page"
                            >
                                <i class="bi bi-chevron-right"></i>
                            </button>

                        </nav>


                    </div>

                </div>

            </div>

        </section>


    </main>



    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <div id="footer"></div>



    <!-- =====================================================
         SHOP JAVASCRIPT
         ===================================================== -->

    <script type="module" src="/js/pages/shop.js"></script>

</body>

</html>
