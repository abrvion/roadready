
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wishlist | RoadReady</title>

    <meta
        name="description"
        content="Save your favorite motorcycle parts, accessories and gear with RoadReady."
    >

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- RoadReady Styles -->

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/pages.css" />
    <link rel="stylesheet" href="/css/responsive.css" />

</head>


<body>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <div id="site-header"></div>



    <main>


        <!-- =================================================
             WISHLIST
             ================================================= -->

        <section class="rr-wishlist">

            <div class="rr-container">


                <!-- Page Header -->

                <div class="rr-page-header">

                    <div>

                        <span class="rr-section-eyebrow">
                            YOUR SAVED ITEMS
                        </span>

                        <h1>
                            Wishlist
                        </h1>

                        <p>
                            Keep track of the products you want to come back to.
                        </p>

                    </div>


                    <a
                        href="/shop"
                        class="rr-page-header-link"
                    >
                        Continue Shopping
                        <i class="bi bi-arrow-right"></i>
                    </a>

                </div>



                <!-- =================================================
                     Wishlist Grid
                     ================================================= -->

                <div class="rr-wishlist-grid">


                    <!-- Product 1 -->

                    <article class="rr-wishlist-card">

                        <div class="rr-wishlist-image">

                            <img
                                src="/assets/images/products/product-placeholder.svg"
                                alt="Premium Motorcycle Brake Pads"
                            >


                            <button
                                type="button"
                                class="rr-wishlist-remove"
                                aria-label="Remove Premium Motorcycle Brake Pads from wishlist"
                                title="Remove from wishlist"
                            >
                                <i class="bi bi-heart-fill"></i>
                            </button>

                        </div>


                        <div class="rr-wishlist-content">

                            <span class="rr-product-category">
                                SPARE PARTS
                            </span>

                            <h2>
                                Premium Motorcycle Brake Pads
                            </h2>

                            <div class="rr-wishlist-bottom">

                                <strong>
                                    ৳1,250
                                </strong>

                                <button
                                    type="button"
                                    class="rr-wishlist-cart"
                                >
                                    <i class="bi bi-bag-plus"></i>
                                    Add to Cart
                                </button>

                            </div>

                        </div>

                    </article>



                    <!-- Product 2 -->

                    <article class="rr-wishlist-card">

                        <div class="rr-wishlist-image">

                            <img
                                src="/assets/images/products/product-placeholder.svg"
                                alt="LED Motorcycle Headlight"
                            >


                            <button
                                type="button"
                                class="rr-wishlist-remove"
                                aria-label="Remove LED Motorcycle Headlight from wishlist"
                                title="Remove from wishlist"
                            >
                                <i class="bi bi-heart-fill"></i>
                            </button>

                        </div>


                        <div class="rr-wishlist-content">

                            <span class="rr-product-category">
                                ELECTRICAL
                            </span>

                            <h2>
                                LED Motorcycle Headlight
                            </h2>

                            <div class="rr-wishlist-bottom">

                                <strong>
                                    ৳1,850
                                </strong>

                                <button
                                    type="button"
                                    class="rr-wishlist-cart"
                                >
                                    <i class="bi bi-bag-plus"></i>
                                    Add to Cart
                                </button>

                            </div>

                        </div>

                    </article>



                    <!-- Product 3 -->

                    <article class="rr-wishlist-card">

                        <div class="rr-wishlist-image">

                            <img
                                src="/assets/images/products/product-placeholder.svg"
                                alt="Motorcycle Chain and Sprocket Kit"
                            >


                            <button
                                type="button"
                                class="rr-wishlist-remove"
                                aria-label="Remove Motorcycle Chain and Sprocket Kit from wishlist"
                                title="Remove from wishlist"
                            >
                                <i class="bi bi-heart-fill"></i>
                            </button>

                        </div>


                        <div class="rr-wishlist-content">

                            <span class="rr-product-category">
                                MAINTENANCE
                            </span>

                            <h2>
                                Motorcycle Chain &amp; Sprocket Kit
                            </h2>

                            <div class="rr-wishlist-bottom">

                                <strong>
                                    ৳2,400
                                </strong>

                                <button
                                    type="button"
                                    class="rr-wishlist-cart"
                                >
                                    <i class="bi bi-bag-plus"></i>
                                    Add to Cart
                                </button>

                            </div>

                        </div>

                    </article>



                    <!-- Product 4 -->

                    <article class="rr-wishlist-card">

                        <div class="rr-wishlist-image">

                            <img
                                src="/assets/images/products/product-placeholder.svg"
                                alt="Motorcycle Riding Gloves"
                            >


                            <button
                                type="button"
                                class="rr-wishlist-remove"
                                aria-label="Remove Motorcycle Riding Gloves from wishlist"
                                title="Remove from wishlist"
                            >
                                <i class="bi bi-heart-fill"></i>
                            </button>

                        </div>


                        <div class="rr-wishlist-content">

                            <span class="rr-product-category">
                                RIDING GEAR
                            </span>

                            <h2>
                                Motorcycle Riding Gloves
                            </h2>

                            <div class="rr-wishlist-bottom">

                                <strong>
                                    ৳1,450
                                </strong>

                                <button
                                    type="button"
                                    class="rr-wishlist-cart"
                                >
                                    <i class="bi bi-bag-plus"></i>
                                    Add to Cart
                                </button>

                            </div>

                        </div>

                    </article>


                </div>

            </div>

        </section>

    </main>



    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <div id="footer"></div>



    <!-- =====================================================
         PAGE SCRIPT
         ===================================================== -->

    <script
        type="module"
        src="/js/pages/wishlist.js"
    ></script>

</body>

</html>
